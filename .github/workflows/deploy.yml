name: Deploy CloudFormation Stack

on:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - '.github/workflows/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read  # Required to checkout the code

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claims
        run: |
          # Request the raw GitHub Actions OIDC token and parse its payload
          RAW_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Token Subject (sub):"
          echo "$RAW_TOKEN" | cut -d. -f2 | base64 --decode 2>/dev/null | jq -r '.sub'
          echo "Token Audience (aud):"
          echo "$RAW_TOKEN" | cut -d. -f2 | base64 --decode 2>/dev/null | jq -r '.aud'

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate CloudFormation Template
        run: |
          echo "Validating CloudFormation template..."
          aws cloudformation validate-template \
            --template-body file://templates/s3-bucket.yaml

      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: demo-s3-stack
          template: templates/s3-bucket.yaml
          no-fail-on-empty-changeset: "1"
          parameter-overrides: "EnvironmentName=dev"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
